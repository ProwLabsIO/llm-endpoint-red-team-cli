name: Publish Package to PyPI (OIDC Trusted Publisher)

on:
  push:
    tags:
      - "v*"

jobs:
  pypi-publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-endpoint-red-team-cli
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify Gate on Sample Archive Before Release
        run: |
          python3 prow_audit.py gate samples/prow_redteam_sample_candidate.zip --min-pass-rate 100
      - name: Publish distribution to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
